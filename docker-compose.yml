services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: amulock
      POSTGRES_PASSWORD: amulock
      POSTGRES_DB: amulock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amulock"]
      interval: 3s
      retries: 10

  api:
    build: .
    container_name: amulock-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://amulock:amulock@db:5432/amulock
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

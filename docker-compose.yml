services:
  api:
    build: .
    container_name: amulock-api
    env_file:
      - .env
    ports:
      - "5000:5000"

  # Throwaway Postgres for the test suite: docker compose up -d db-test
  db-test:
    image: docker.io/library/postgres:16
    container_name: amulock-db-test
    environment:
      POSTGRES_USER: amulock
      POSTGRES_PASSWORD: amulock
      POSTGRES_DB: amulock_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amulock -d amulock_test"]
      interval: 2s
      retries: 15
